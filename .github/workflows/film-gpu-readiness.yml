name: Film Studio Remote GPU Worker Safety Checks
on:
  push:
    branches: [film-remote-gpu-readiness-20261022]
    paths:
      - 'studio/gpu-worker/**'
      - '.github/workflows/film-gpu-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local-only security tests
        working-directory: studio/gpu-worker
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Check local adapter parses without GPU and third-party packages
        run: |
          python -m py_compile studio/gpu-worker/comfy_local_worker.py
          python studio/gpu-worker/comfy_local_worker.py --help
      - name: Parse Windows diagnostic PowerShell without executing hardware probes
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path studio/gpu-worker/Check-FilmStudioGPU.ps1).Path,
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'PASS PowerShell diagnostic syntax'
      - name: Package owner-reviewable Windows diagnostic and worker kit
        run: |
          mkdir -p gpu-kit
          cp studio/gpu-worker/{Check-FilmStudioGPU.ps1,README.md,comfy_local_worker.py,test_comfy_local_worker.py} gpu-kit/
          cd gpu-kit
          zip -q ../Elijah-Film-Studio-Dan-GPU-Readiness-Kit.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: dan-consented-gpu-readiness-kit
          path: Elijah-Film-Studio-Dan-GPU-Readiness-Kit.zip
          retention-days: 14

