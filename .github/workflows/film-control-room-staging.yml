name: Film Studio Hostinger Control Room - staging QA
on:
  push:
    branches: [studio-control-room-staging-20261022, studio-operator-phase2-20261022]
    paths:
      - 'studio/control-room/**'
      - '.github/workflows/film-control-room-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test secure read-only control room
        working-directory: studio/control-room
        run: npm test
      - name: Parse production dashboard inline JavaScript
        working-directory: studio/control-room
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if(scripts.length!==1)throw new Error('Expected exactly one inline dashboard script');
          for(const s of scripts)new vm.Script(s[1]);
          for(const marker of ['operBrief','operRefresh','operVideo','operSignIn'])
            if(!html.includes('id="'+marker+'"'))throw new Error('Missing operator control: '+marker);
          console.log('PASS: dashboard JS parses and operator controls present');
          NODE
      - name: Verify server can start without credentials
        working-directory: studio/control-room
        run: |
          PORT=3081 node server.mjs > /tmp/studio-control.log 2>&1 &
          pid=$!
          sleep 2
          curl --fail --silent http://127.0.0.1:3081/healthz
          curl --fail --silent http://127.0.0.1:3081/ | grep -q 'ELIJAH FILM STUDIO'
          kill "$pid"
      - name: Verify Hostinger import-mode startup
        working-directory: studio/control-room
        run: |
          PORT=3082 node --input-type=module -e "import('./server.mjs')" > /tmp/studio-hostinger-import.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:3082/healthz
          cat /tmp/studio-hostinger-import.log
