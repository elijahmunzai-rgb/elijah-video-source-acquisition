name: Calibrated synthetic 3D camera tracking solver acceptance
on:
  push:
    branches: [main]
    paths:
      - 'studio/proofs/calibrated_pnp.py'
      - '.github/workflows/calibrated-camera-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrated-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opencv-python-headless numpy
      - run: python studio/proofs/calibrated_pnp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrated-3d-camera-synthetic-ground-truth-qa
          path: proof/calibrated_pnp_report.json
          if-no-files-found: warn
          retention-days: 7
