name: Film Studio full-length public production (real duration, voice, music)
on:
  push:
    branches:
      - film-studio-full-workflow-v1-20261022
      - studio-operator-phase2-20261022
    paths:
      - 'studio/control-room/**'
      - 'studio/full-workflow/**'
      - '.github/workflows/film-studio-full-production.yml'
  workflow_dispatch:
    inputs:
      spec_json:
        description: Public nonconfidential project JSON (empty runs approved 15s sample)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: studio-full-film-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-and-validate:
    if: github.repository == 'elijahmunzai-rgb/elijah-video-source-acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full web application contracts and client JavaScript
        working-directory: studio/control-room
        run: |
          npm test
          node --check server.mjs
          node --check operator.mjs
          node --check studio-spec.mjs
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('studio.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1)throw Error('Expected one self-contained studio UI script');
          new vm.Script(scripts[0][1],{filename:'studio UI'});
          JS
      - name: Prepare verified free CPU media utilities
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v espeak-ng >/dev/null; then
            timeout 150 sudo apt-get update -qq
            timeout 180 sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          fi
          command -v ffmpeg
          command -v espeak-ng
          ffmpeg -hide_banner -filters | grep -E 'drawtext|loudnorm'
      - name: Resolve one owner-approved public project or 15s standalone test
        env:
          PUBLIC_SPEC_JSON: ${{ inputs.spec_json }}
        run: |
          set -euo pipefail
          mkdir -p film-work
          if [ -n "$PUBLIC_SPEC_JSON" ]; then
            printf '%s' "$PUBLIC_SPEC_JSON" > film-work/project.json
          else
            added="$(git diff HEAD^ HEAD --diff-filter=A --name-only -- studio/full-workflow/requests/)"
            if [ -n "$added" ]; then
              test "$(printf '%s\n' "$added" | wc -l)" -eq 1
              echo "$added" | grep -Eq '^studio/full-workflow/requests/film-[0-9]+-[a-f0-9]{10}\.json$'
              test "$(wc -c < "$added")" -le 60000
              cp "$added" film-work/project.json
            else
              cp studio/full-workflow/examples/public-15-second-people-first.json film-work/project.json
            fi
          fi
          python studio/full-workflow/render.py --project film-work/project.json --output film-work --validate-only
      - name: Actually render encoded film, source footage, soundtrack and narration
        run: |
          python studio/full-workflow/render.py --project film-work/project.json --output film-work/output
          ffprobe -v error -show_format -show_streams -of json film-work/output/film-studio-public-demo.mp4 > film-work/output/FFPROBE.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('film-work/output')
          qa=json.loads((p/'RENDER_QA.json').read_text())
          spec=json.loads((p/'SHOT_PLAN.json').read_text())
          tech=json.loads((p/'FFPROBE.json').read_text())
          assert qa['technical_pass'] and not qa['public_publish_approved']
          assert abs(qa['duration_seconds']-spec['duration_seconds'])<.18
          assert qa['source_segments']==len(spec['scenes'])
          assert any(s['codec_type']=='audio' for s in tech['streams'])
          assert (p/'film-studio-public-demo.mp4').stat().st_size>500000
          print('PASS actual encoded requested duration with non-repeated approved stock segments and original audio. Creative review remains blocked.')
          PY
      - name: Upload final film and human-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elijah-film-studio-full-duration-public-demo-review
          path: |
            film-work/output/film-studio-public-demo.mp4
            film-work/output/RENDER_QA.json
            film-work/output/SHOT_PLAN.json
            film-work/output/SOURCE_RIGHTS.json
            film-work/output/FFPROBE.json
          if-no-files-found: warn
          retention-days: 7
