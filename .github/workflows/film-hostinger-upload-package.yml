name: Package Hostinger Film Studio Staging Web App (no secrets)
on:
  push:
    branches: [studio-control-room-staging-20261022, studio-operator-phase2-20261022]
    paths:
      - 'studio/control-room/**'
      - '.github/workflows/film-hostinger-upload-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all read-only control-room tests
        working-directory: studio/control-room
        run: npm test
      - name: Build minimal ZIP with package.json at archive root
        run: |
          mkdir -p release
          cd studio/control-room
          test -f package.json && test -f server.mjs && test -f index.html && test -f operator.mjs && test -f media.mjs
          node --check server.mjs && node --check operator.mjs && node --check media.mjs
          node -e "let p=require('./package.json');if(p.scripts.start!=='node server.mjs')process.exit(1)"
          zip -q -j ../../release/Elijah-Film-Studio-Hostinger-Staging.zip package.json server.mjs index.html operator.mjs media.mjs
          cd ../..
          test "$(unzip -Z1 release/Elijah-Film-Studio-Hostinger-Staging.zip | wc -l)" -eq 5
          unzip -Z1 release/Elijah-Film-Studio-Hostinger-Staging.zip
          sha256sum release/*.zip > release/SHA256SUMS.txt
          echo "No paid service, no runtime secrets, and no customer footage in this artifact."
      - name: Export Hostinger upload-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-staging-upload-ready-zip
          path: release/
          if-no-files-found: error
          retention-days: 30
